allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  vue-demi: true

overrides:
  "js-yaml@>=3.0.0 <3.15.2": 3.15.2
  "markdown-it@>=14.0.0 <14.3.1": 14.3.1
  "source-map-js@>=1.0.0 <1.2.2": 1.2.2
  # argparse 2 retains the v1 CLI API and removes vulnerable sprintf-js.
  "js-yaml@3.15.2>argparse": 2.0.1

# VuePress v2 RC packages declare adjacent peer ranges. These exact versions
# are pinned and validated together by the lockfile and CI.
peerDependencyRules:
  allowedVersions:
    "@vuepress/bundler-vite": 2.0.0-rc.31
    markdown-it: 15.0.1
    vuepress: 2.0.0-rc.31

[project]
name = "investment-research"
version = "0.1.0"
description = "公开投资研究：宏观数据抓取、跨资产分析与可复现图表"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # 数据处理
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    # 统计建模
    "statsmodels>=0.14",
    "scipy>=1.13",
    # 数据源
    "yfinance>=0.2.40",
    "fredapi>=0.5.2",
    "akshare>=1.14",
    "requests>=2.32",
    # 可视化
    "plotly>=5.22",
    "matplotlib>=3.9",
    "kaleido>=0.2.1",
    # 工具
    "python-dotenv>=1.0",
    "tabulate>=0.9",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inv"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # vue-tsc 3.x uses compiler entry points removed by TypeScript 7.
    # Re-enable major upgrades after validating a compatible vue-tsc release.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    groups:
      vuepress:
        patterns:
          - "@vuepress/*"
          - vuepress
      frontend-tooling:
        patterns:
          - vite
          - typescript
          - vue-tsc
          - tsx

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
